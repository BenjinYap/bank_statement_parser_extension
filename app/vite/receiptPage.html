<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Receipt Upload</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      box-sizing: border-box;
      background: #18181b;
      color: #f4f4f5;
      font-family: system-ui, sans-serif;
    }

    label {
      width: 100%;
      max-width: 400px;
      padding: 48px 24px;
      box-sizing: border-box;
      border-radius: 24px;
      background: #2563eb;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
    }

    label.busy {
      background: #52525b;
      pointer-events: none;
    }

    input {
      display: none;
    }

    #status {
      min-height: 24px;
      font-size: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <label
    id="button"
    class="busy"
  >
    <span id="buttonText"></span>
    <input
      id="input"
      type="file"
      accept="image/*"
      capture="environment"
    >
  </label>
  <div id="status"></div>

  <script>
    // Textract accepts at most 5 MB, so shrink the photo before upload.
    const MAX_SIDE = 2500;
    const JPEG_QUALITY = 0.85;
    const STATUS_POLL_INTERVAL_MS = 1000;

    const button = document.getElementById('button');
    const buttonText = document.getElementById('buttonText');
    const photoInput = document.getElementById('input');
    const statusElement = document.getElementById('status');

    // True while the receipt window in the extension polls the dev server for a photo.
    let windowReady = false;
    let uploading = false;

    function updateButton() {
      button.classList.toggle('busy', !windowReady || uploading);
      if (uploading) {
        buttonText.textContent = 'Uploading...';
      } else if (windowReady) {
        buttonText.textContent = 'Take receipt photo';
      } else {
        buttonText.textContent = 'Open Scan Receipt in the extension';
      }
    }

    // Asks the dev server each second whether the receipt window is open.
    async function pollStatus() {
      try {
        const response = await fetch('/receipt/status', { cache: 'no-store' });
        const body = await response.json();
        windowReady = body.ready === true;
      } catch {
        windowReady = false;
      }

      updateButton();
      setTimeout(pollStatus, STATUS_POLL_INTERVAL_MS);
    }

    async function shrink(file) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();

      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob === null) {
            reject(new Error('The photo could not be converted to JPEG.'));
            return;
          }

          resolve(blob);
        }, 'image/jpeg', JPEG_QUALITY);
      });
    }

    async function upload(file) {
      uploading = true;
      updateButton();
      statusElement.textContent = '';
      try {
        const blob = await shrink(file);
        const response = await fetch('/receipt/photo', {
          method: 'POST',
          headers: { 'Content-Type': 'image/jpeg' },
          body: blob,
        });
        if (!response.ok) {
          statusElement.textContent = `Upload failed: ${await response.text()}`;
          return;
        }

        statusElement.textContent = 'Uploaded. Check the extension.';
      } catch (error) {
        statusElement.textContent = `Upload failed: ${error.message}`;
      } finally {
        uploading = false;
        updateButton();
      }
    }

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      photoInput.value = '';
      if (file === undefined) {
        return;
      }

      upload(file);
    });

    updateButton();
    pollStatus();
  </script>
</body>
</html>
